<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="terraz-build" content="20260724-5">
  <meta name="terraz-assets" content="20260724-6">
  <title>TerraZ — Terraria-сервер</title>
  <meta name="description" content="Русскоязычный сервер Terraria TerraZ. Подключайтесь к s.terraz.ru:7777 или запускайте игру через Steam.">
  <link rel="canonical" href="https://terraz.ru/">
  <link rel="shortcut icon" href="assets/favicon.ico">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="76x76" href="assets/apple-touch-icon-76x76.png">
  <link rel="apple-touch-icon" sizes="120x120" href="assets/apple-touch-icon-120x120.png">
  <link rel="stylesheet" href="assets/css/style.css?v=20260724-6">
  <link rel="stylesheet" href="assets/css/homepage-interactions.css?v=20260724-6">
  <link rel="stylesheet" href="assets/css/static-video.css?v=20260724-6">
  <link rel="stylesheet" href="assets/css/motion-preferences.css?v=20260724-6">
</head>
<body>
  <main class="hero" id="hero">
    <div class="hero__media" aria-hidden="true">
      <div class="hero__poster"></div>
      <div class="hero__video" id="hero-video">
        <video
          class="hero__video-element"
          id="hero-video-element"
          data-loop-start="12"
          autoplay
          muted
          playsinline
          preload="metadata"
          disablepictureinpicture
          tabindex="-1"
        >
          <source
            src="https://d.terraz.ru/static/Eye_of_Cthulhu_By_Cupquake_Terraria_Speed_Art.mp4"
            type="video/mp4"
          >
        </video>
      </div>
      <div class="hero__overlay"></div>
    </div>

    <a class="portal-link" href="https://fun.terraz.ru/" aria-label="Открыть основной информационный сайт TerraZ">
      <span class="portal-link__copy">
        <span class="portal-link__domain">FUN.TERRAZ.RU</span>
        <span class="portal-link__title">Всё о сервере</span>
      </span>
      <span class="portal-link__arrow" aria-hidden="true">→</span>
    </a>

    <section class="hero__content" aria-labelledby="hero-title">
      <img class="hero__logo" src="assets/images/terraz-logo.svg?v=20260724-6" alt="TerraZ" width="255" height="150">

      <div class="hero__message">
        <h1 id="hero-title">Играй<br>уже сейчас</h1>
        <p>Русскоязычный сервер Terraria</p>
      </div>

      <div class="server-actions">
        <button class="server-copy" id="server-copy" type="button" data-address="S.TERRAZ.RU:7777" aria-describedby="copy-status">
          <span class="server-copy__address">S.TERRAZ.RU:7777</span>
          <span class="server-copy__action">
            <span class="server-copy__icon" aria-hidden="true">⧉</span>
            <span class="server-copy__label">Копировать</span>
          </span>
        </button>
        <span class="copy-status" id="copy-status" role="status" aria-live="polite" aria-atomic="true">Скопировано</span>

        <a class="steam-link" href="steam://rungameid/105600// -j s.terraz.ru -p 7777">Играть через Steam</a>
      </div>

      <nav class="social-links" aria-label="TerraZ в социальных сетях">
        <a class="social-link" href="https://vk.com/terraz" aria-label="TerraZ во ВКонтакте">
          <span class="social-link__icon social-link__icon--vk" aria-hidden="true"></span>
        </a>
        <a class="social-link" href="https://www.youtube.com/xekep" aria-label="TerraZ на YouTube">
          <span class="social-link__icon social-link__icon--youtube" aria-hidden="true"></span>
        </a>
        <a class="social-link" href="/conference" aria-label="Конференция TerraZ в Discord">
          <span class="social-link__icon social-link__icon--discord" aria-hidden="true"></span>
        </a>
        <a class="social-link" href="https://t.me/terraz_discussion" aria-label="Обсуждение TerraZ в Telegram">
          <span class="social-link__icon social-link__icon--telegram" aria-hidden="true"></span>
        </a>
        <a class="social-link" href="https://www.twitch.tv/xekep" aria-label="TerraZ на Twitch">
          <span class="social-link__icon social-link__icon--twitch" aria-hidden="true"></span>
        </a>
      </nav>
    </section>

    <div class="video-controls" id="video-controls" aria-label="Управление фоновым видео">
      <button class="video-control" id="video-pause" type="button" aria-label="Приостановить фоновое видео">
        <span aria-hidden="true">Ⅱ</span>
      </button>
      <button class="video-control" id="video-volume" type="button" aria-label="Включить звук фонового видео">
        <span aria-hidden="true">×</span>
      </button>
    </div>
  </main>

  <script src="assets/js/index.js?v=20260724-6" defer></script>
</body>
</html>
