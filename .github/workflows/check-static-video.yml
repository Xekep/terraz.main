name: Check static video endpoint

on:
  pull_request:
    branches:
      - gh-pages

permissions:
  contents: read

jobs:
  check-video:
    runs-on: ubuntu-latest
    env:
      VIDEO_URL: https://d.terraz.ru/static/Eye_of_Cthulhu_By_Cupquake_Terraria_Speed_Art.mp4
    steps:
      - name: Collect concise video diagnostics
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location --head "$VIDEO_URL" > head.txt
          curl --fail --silent --show-error --location --range 0-1048575 \
            --dump-header range-head.txt --output range-head.bin "$VIDEO_URL"
          curl --fail --silent --show-error --location --range -1048576 \
            --dump-header range-tail.txt --output range-tail.bin "$VIDEO_URL"

          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

          ffprobe -v error \
            -show_entries format=format_name,duration,size,bit_rate \
            -show_entries stream=index,codec_type,codec_name,profile,width,height,pix_fmt,r_frame_rate,avg_frame_rate,bit_rate \
            -of json "$VIDEO_URL" > ffprobe.json

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          def headers(path):
              text = Path(path).read_text(encoding='latin-1')
              result = {'status': re.findall(r'^HTTP/\S+\s+(\d+)', text, re.M)[-1]}
              for key in ('content-type', 'content-length', 'accept-ranges', 'content-range', 'cache-control', 'etag', 'last-modified'):
                  matches = re.findall(rf'^{re.escape(key)}:\s*(.+)$', text, re.I | re.M)
                  if matches:
                      result[key] = matches[-1].strip()
              return result

          def atoms(path):
              data = Path(path).read_bytes()
              return {atom.decode(): data.find(atom) for atom in (b'ftyp', b'moov', b'mdat')}

          probe = json.loads(Path('ffprobe.json').read_text())
          report = {
              'head': headers('head.txt'),
              'first_range': headers('range-head.txt'),
              'last_range': headers('range-tail.txt'),
              'first_megabyte_atoms': atoms('range-head.bin'),
              'last_megabyte_atoms': atoms('range-tail.bin'),
              'ffprobe': probe,
          }
          Path('video-report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
          print(json.dumps(report, ensure_ascii=False, indent=2))

          head = report['head']
          first = report['first_range']
          if head.get('content-type') != 'video/mp4':
              raise SystemExit('Wrong MIME type')
          if head.get('accept-ranges') != 'bytes':
              raise SystemExit('Byte ranges are disabled')
          if first.get('status') != '206':
              raise SystemExit('Range request did not return 206')
          PY

      - name: Upload video diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: static-video-diagnostics
          path: |
            video-report.json
            head.txt
            range-head.txt
            range-tail.txt
            ffprobe.json
          retention-days: 1
