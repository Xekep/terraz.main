name: Rebuild and verify Pages site

on:
  push:
    branches:
      - gh-pages
  pull_request:
    branches:
      - gh-pages
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: github-pages-rebuild-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      API_URL: https://api.github.com/repos/${{ github.repository }}/pages
      LIVE_URL: https://terraz.ru/
      VIDEO_URL: https://d.terraz.ru/static/Eye_of_Cthulhu_By_Cupquake_Terraria_Speed_Art.mp4
      EXPECTED_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
    steps:
      - name: Request Pages rebuild
        shell: bash
        run: |
          set -u

          api_request() {
            local method="$1"
            local url="$2"
            local output="$3"
            curl --silent --show-error \
              --request "$method" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$output" \
              --write-out "%{http_code}" \
              "$url"
          }

          config_status="$(api_request GET "${API_URL}" pages-config.json)"
          build_status="$(api_request POST "${API_URL}/builds" pages-build.json)"

          echo "Pages config HTTP: ${config_status}"
          cat pages-config.json
          echo
          echo "Pages rebuild HTTP: ${build_status}"
          cat pages-build.json
          echo

          if [[ "$config_status" != "200" || "$build_status" != "201" ]]; then
            exit 1
          fi

      - name: Wait for requested Pages build
        shell: bash
        run: |
          set -u

          api_get() {
            local url="$1"
            local output="$2"
            curl --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$output" \
              --write-out "%{http_code}" \
              "$url"
          }

          build_ready=false
          for attempt in $(seq 1 60); do
            sleep 2
            http_status="$(api_get "${API_URL}/builds/latest" pages-latest.json)"
            build_state="$(python3 -c 'import json; print(json.load(open("pages-latest.json")).get("status", ""))')"
            build_commit="$(python3 -c 'import json; print(json.load(open("pages-latest.json")).get("commit", ""))')"
            echo "attempt=${attempt} HTTP=${http_status} status=${build_state} commit=${build_commit} expected=${EXPECTED_COMMIT}"

            if [[ "$http_status" == "200" && "$build_state" == "built" && "$build_commit" == "$EXPECTED_COMMIT" ]]; then
              build_ready=true
              break
            fi

            if [[ "$build_state" == "errored" ]]; then
              cat pages-latest.json
              exit 1
            fi
          done

          cat pages-latest.json
          echo

          if [[ "$build_ready" != "true" ]]; then
            echo "The expected Pages build did not finish" >&2
            exit 1
          fi

      - name: Verify live homepage resources
        shell: bash
        run: |
          set -u

          live_ready=false
          for attempt in $(seq 1 30); do
            probe_url="${LIVE_URL}?pages_probe=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            live_status="$(curl --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              --header 'Pragma: no-cache' \
              --output live-index.html \
              --write-out '%{http_code}' \
              "$probe_url")"

            if [[ "$live_status" == "200" ]] && grep -q 'name="terraz-assets" content="20260725-2"' live-index.html; then
              live_ready=true
              break
            fi

            echo "Live site is not updated yet: attempt=${attempt} HTTP=${live_status}"
            sleep 2
          done

          if [[ "$live_ready" != "true" ]]; then
            echo "Live domain still serves a stale homepage" >&2
            head -n 70 live-index.html
            exit 1
          fi

          readarray -t asset_urls < <(python3 - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import urljoin

          html = Path('live-index.html').read_text(encoding='utf-8')
          patterns = [
              r'href="([^"]*homepage-interactions\.css[^"]*)"',
              r'href="([^"]*static-video\.css[^"]*)"',
              r'href="([^"]*logo-drawing\.css[^"]*)"',
              r'src="([^"]*assets/js/index\.js[^"]*)"',
              r'src="([^"]*assets/js/logo-animation\.js[^"]*)"',
          ]
          for pattern in patterns:
              match = re.search(pattern, html)
              if not match:
                  raise SystemExit(f'Asset is not linked: {pattern}')
              print(urljoin('https://terraz.ru/', match.group(1)))
          PY
          )

          curl --fail --silent --show-error --location "${asset_urls[0]}" --output interactions.css
          curl --fail --silent --show-error --location "${asset_urls[1]}" --output static-video.css
          curl --fail --silent --show-error --location "${asset_urls[2]}" --output logo-drawing.css
          curl --fail --silent --show-error --location "${asset_urls[3]}" --output homepage.js
          curl --fail --silent --show-error --location "${asset_urls[4]}" --output logo-animation.js

          grep -Fq '.social-link__icon--vk' interactions.css
          grep -Fq '@keyframes copy-fade' interactions.css
          grep -Fq 'object-fit: cover' static-video.css
          grep -Fq 'scale(1.2)' static-video.css
          ! grep -Fq 'scale(1.02)' static-video.css
          grep -Fq 'background: transparent !important' logo-drawing.css
          grep -Fq '.hero__logo-svg' logo-drawing.css
          grep -Fq 'box-shadow: none' logo-drawing.css
          grep -Fq 'filter: none' logo-drawing.css
          grep -Fq 'fetch(source' logo-animation.js
          grep -Fq 'DOMParser' logo-animation.js
          grep -Fq 'replaceChildren' logo-animation.js
          grep -Fq 'path.style.fill = "none"' logo-animation.js
          grep -Fq 'path.style.stroke = "#ffffff"' logo-animation.js
          grep -Fq 'path.style.strokeWidth = "1.15"' logo-animation.js
          grep -Fq 'getTotalLength' logo-animation.js
          grep -Fq 'path.animate' logo-animation.js
          ! grep -Fq '#1fb8b2' logo-animation.js
          ! grep -Fq '#71e7df' logo-animation.js
          ! grep -Fq '<object' live-index.html
          grep -Fq 'id="hero-logo"' live-index.html
          grep -Fq 'showCopyStatus' homepage.js
          grep -Fq 'DEFAULT_LOOP_START = 12' homepage.js
          grep -Fq 'handleVideoEnded' homepage.js
          ! grep -Fq 'YT.Player' homepage.js
          ! grep -Fq 'iframe_api' homepage.js
          grep -Fq "$VIDEO_URL" live-index.html

          range_status="$(curl --silent --show-error --location \
            --range 0-1023 \
            --dump-header video-range.txt \
            --output video-range.bin \
            --write-out '%{http_code}' \
            "$VIDEO_URL")"
          test "$range_status" = "206"
          grep -Eqi '^content-type: *video/mp4' video-range.txt
          grep -Eqi '^accept-ranges: *bytes' video-range.txt
          grep -Eqi '^content-range: *bytes 0-1023/' video-range.txt
          test "$(wc -c < video-range.bin)" -eq 1024

          echo 'Live homepage resources and progressive MP4 endpoint are available.'

      - name: Check out browser verification
        uses: actions/checkout@v5

      - name: Prepare Chrome browser test
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome_path" ]]; then
            echo 'Chrome or Chromium is unavailable on the runner' >&2
            exit 1
          fi
          echo "CHROME_PATH=${chrome_path}" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false puppeteer-core@24.15.0

      - name: Verify rendered homepage and static video in Chrome
        env:
          LIVE_URL: https://terraz.ru/
        run: node .github/scripts/verify_live_homepage.mjs

      - name: Upload live homepage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-homepage-diagnostics
          path: |
            live-homepage.png
            live-homepage-reduced-motion.png
            live-homepage-report.json
          if-no-files-found: warn
          retention-days: 7
