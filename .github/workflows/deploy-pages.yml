name: Rebuild and verify Pages site

on:
  push:
    branches: [gh-pages]
  pull_request:
    branches: [gh-pages]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: github-pages-rebuild-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      API_URL: https://api.github.com/repos/${{ github.repository }}/pages
      LIVE_URL: https://terraz.ru/
      VIDEO_URL: https://d.terraz.ru/static/Eye_of_Cthulhu_By_Cupquake_Terraria_Speed_Art.mp4
      EXPECTED_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
      EXPECTED_ASSETS: 20260725-7
    steps:
      - name: Request Pages rebuild
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output pages-build.json --write-out '%{http_code}' "${API_URL}/builds")"
          cat pages-build.json
          test "$status" = "201"

      - name: Wait for Pages build and public version
        shell: bash
        run: |
          set -euo pipefail
          built=false
          for attempt in $(seq 1 60); do
            sleep 2
            curl --fail --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${API_URL}/builds/latest" --output pages-latest.json
            state="$(python3 -c 'import json; print(json.load(open("pages-latest.json")).get("status", ""))')"
            commit="$(python3 -c 'import json; print(json.load(open("pages-latest.json")).get("commit", ""))')"
            echo "attempt=${attempt} status=${state} commit=${commit} expected=${EXPECTED_COMMIT}"
            if [[ "$state" == "built" && "$commit" == "$EXPECTED_COMMIT" ]]; then
              built=true
              break
            fi
            [[ "$state" != "errored" ]]
          done
          test "$built" = "true"

          live=false
          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --location \
              --header 'Cache-Control: no-cache' --header 'Pragma: no-cache' \
              --output live-index.html --write-out '%{http_code}' \
              "${LIVE_URL}?pages_probe=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}")"
            if [[ "$status" == "200" ]] && grep -q "name=\"terraz-assets\" content=\"${EXPECTED_ASSETS}\"" live-index.html; then
              live=true
              break
            fi
            sleep 2
          done
          test "$live" = "true"

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate source and progressive video
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/index.js
          node --check assets/js/logo-animation.js
          node --check .github/scripts/verify_live_homepage_v2.mjs
          python3 -m py_compile .github/scripts/validate_site.py .github/scripts/validate_homepage.py
          python3 .github/scripts/validate_site.py
          python3 .github/scripts/validate_homepage.py
          status="$(curl --silent --show-error --location --range 0-1023 \
            --dump-header video-range.txt --output video-range.bin \
            --write-out '%{http_code}' "$VIDEO_URL")"
          test "$status" = "206"
          grep -Eqi '^content-type: *video/mp4' video-range.txt
          grep -Eqi '^content-range: *bytes 0-1023/' video-range.txt
          test "$(wc -c < video-range.bin)" -eq 1024

      - name: Prepare Chrome
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome_path"
          echo "CHROME_PATH=${chrome_path}" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false puppeteer-core@24.15.0

      - name: Verify desktop and mobile rendering
        env:
          LIVE_URL: https://terraz.ru/
        run: node .github/scripts/verify_live_homepage.mjs

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-homepage-diagnostics
          path: |
            live-homepage.png
            live-homepage-reduced-motion.png
            live-homepage-mobile.png
            live-homepage-report.json
          if-no-files-found: warn
          retention-days: 7
