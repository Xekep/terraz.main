name: Validate site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/index.js
          node --check assets/js/logo-animation.js
          node --check assets/js/mgGlitch.min.js
          node --check assets/js/redirect.js
          node --check assets/js/error.js
          node --check .github/scripts/verify_live_homepage.mjs
          node --check .github/scripts/verify_live_homepage_v2.mjs

      - name: Check Python syntax
        run: |
          python3 -m py_compile .github/scripts/validate_site.py
          python3 -m py_compile .github/scripts/validate_homepage.py

      - name: Validate HTML, assets and code hygiene
        run: python3 .github/scripts/validate_site.py

      - name: Check homepage regressions
        shell: bash
        run: |
          set -o pipefail
          python3 .github/scripts/validate_homepage.py 2>&1 | tee homepage-validation.log

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-validation
          path: homepage-validation.log
          if-no-files-found: warn
          retention-days: 2
