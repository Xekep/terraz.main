name: Validate site

on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/index.js
          node --check assets/js/mgGlitch.min.js
          node --check assets/js/redirect.js
          node --check assets/js/error.js

      - name: Check Python syntax
        run: |
          python3 -m py_compile .github/scripts/validate_site.py
          python3 -m py_compile .github/scripts/validate_homepage.py

      - name: Validate HTML, assets and code hygiene
        run: python3 .github/scripts/validate_site.py

      - name: Check homepage regressions
        run: python3 .github/scripts/validate_homepage.py

      - name: Inspect Pages and request legacy rebuild
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: https://api.github.com/repos/${{ github.repository }}/pages
        shell: bash
        run: |
          set -u

          echo '=== Pages configuration ==='
          config_status="$(curl --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output pages-config.json \
            --write-out "%{http_code}" \
            "${API_URL}")"
          echo "HTTP ${config_status}"
          cat pages-config.json
          echo

          echo '=== Pages rebuild request ==='
          build_status="$(curl --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output pages-build.json \
            --write-out "%{http_code}" \
            "${API_URL}/builds")"
          echo "HTTP ${build_status}"
          cat pages-build.json
          echo

          if [[ "$config_status" != "200" || "$build_status" != "201" ]]; then
            exit 1
          fi
