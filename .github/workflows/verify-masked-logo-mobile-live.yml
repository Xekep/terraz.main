name: Verify masked logo and mobile video live

on:
  pull_request:
    branches: [gh-pages]

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Check out verification scripts
        uses: actions/checkout@v5

      - name: Prepare Chrome
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome_path"
          echo "CHROME_PATH=${chrome_path}" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false puppeteer-core@24.15.0

      - name: Verify published desktop and mobile homepage
        env:
          LIVE_URL: https://terraz.ru/
        run: node .github/scripts/verify_live_homepage.mjs

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masked-logo-mobile-live-diagnostics
          path: |
            live-homepage.png
            live-homepage-reduced-motion.png
            live-homepage-mobile.png
            live-homepage-report.json
          if-no-files-found: warn
          retention-days: 2
