name: Verify live desktop fix

on:
  pull_request:
    branches:
      - gh-pages

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Check out verification scripts
        uses: actions/checkout@v5

      - name: Prepare Chrome
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome_path" ]]; then
            echo 'Chrome or Chromium is unavailable' >&2
            exit 1
          fi
          echo "CHROME_PATH=${chrome_path}" >> "$GITHUB_ENV"
          npm install --no-save --package-lock=false puppeteer-core@24.15.0

      - name: Verify public homepage in normal and reduced-motion desktop modes
        env:
          LIVE_URL: https://terraz.ru/
        shell: bash
        run: |
          set -o pipefail
          node .github/scripts/verify_live_homepage.mjs 2>&1 | tee live-browser-log.txt

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-desktop-fix-diagnostics
          path: |
            live-homepage.png
            live-homepage-reduced-motion.png
            live-homepage-report.json
            live-browser-log.txt
          if-no-files-found: warn
          retention-days: 2
